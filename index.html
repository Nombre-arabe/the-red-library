<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leon Survival - Solo Juego</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        canvas {
            display: block;
            background: #111;
            image-rendering: pixelated;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }

        .hp-bar {
            width: 150px;
            height: 10px;
            background: #500;
            border: 1px solid #ff0000;
            margin-top: 5px;
        }

        .hp-fill {
            width: 100%;
            height: 100%;
            background: #ff0000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div>
            <div>LEON S. KENNEDY</div>
            <div class="hp-bar"><div class="hp-fill" id="hp"></div></div>
        </div>
        <div style="text-align: right;">
            <div>PISO 1</div>
            <div>ELIMINADOS: <span id="kills">0</span> / 30</div>
        </div>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Configuración de Leon
let player = {
    x: 400,
    y: 250,
    speed: 4,
    hp: 100
};

let bullets = [];
let enemies = [];
let keys = {};
let kills = 0;
let lastShot = 0;
const shotCooldown = 200;

// Registrar teclas pulsadas
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Función para disparar
function shoot(dir) {
    const now = Date.now();
    if (now - lastShot < shotCooldown) return;
    
    let vx = 0, vy = 0;
    if (dir === 'up') vy = -7;
    if (dir === 'down') vy = 7;
    if (dir === 'left') vx = -7;
    if (dir === 'right') vx = 7;

    bullets.push({ x: player.x, y: player.y - 10, vx, vy });
    lastShot = now;
}

// Generar zombis en los bordes
function spawnZombie() {
    if (enemies.length >= 6) return;
    let edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * 800; y = -20; }
    if (edge === 1) { x = Math.random() * 800; y = 520; }
    if (edge === 2) { x = -20; y = Math.random() * 500; }
    if (edge === 3) { x = 820; y = Math.random() * 500; }
    
    enemies.push({ x, y, speed: 1.2, hp: 3 });
}

// Bucle principal del juego
function loop() {
    // 1. LÓGICA DE MOVIMIENTO (WASD)
    if (keys['w'] || keys['w']) player.y -= player.speed;
    if (keys['s'] || keys['s']) player.y += player.speed;
    if (keys['a'] || keys['a']) player.x -= player.speed;
    if (keys['d'] || keys['d']) player.x += player.speed;

    // Límites de la pantalla para Leon
    if (player.x < 15) player.x = 15;
    if (player.x > 785) player.x = 785;
    if (player.y < 15) player.y = 15;
    if (player.y > 485) player.y = 485;

    // 2. LÓGICA DE DISPARO (Flechas del teclado)
    if (keys['arrowup']) shoot('up');
    if (keys['arrowdown']) shoot('down');
    if (keys['arrowleft']) shoot('left');
    if (keys['arrowright']) shoot('right');

    // Mover Balas
    bullets.forEach((b, index) => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0 || b.x > 800 || b.y < 0 || b.y > 500) {
            bullets.splice(index, 1);
        }
    });

    // Aparecer enemigos aleatoriamente
    if (Math.random() < 0.02) spawnZombie();

    // Mover Zombis hacia Leon
    enemies.forEach((enemy, eIndex) => {
        let dx = player.x - enemy.x;
        let dy = player.y - enemy.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > 0) {
            enemy.x += (dx / dist) * enemy.speed;
            enemy.y += (dy / dist) * enemy.speed;
        }

        // Detectar si la bala le da al zombi
        bullets.forEach((bullet, bIndex) => {
            let bDx = bullet.x - enemy.x;
            let bDy = bullet.y - enemy.y;
            let bDist = Math.sqrt(bDx * bDx + bDy * bDy);
            
            if (bDist < 15) { // Impacto
                enemy.hp--;
                bullets.splice(bIndex, 1);
                if (enemy.hp <= 0) {
                    enemies.splice(eIndex, 1);
                    kills++;
                    document.getElementById('kills').innerText = kills;
                }
            }
        });

        // Daño a Leon si el zombi lo toca
        if (dist < 15) {
            player.hp -= 0.15;
            if (player.hp < 0) player.hp = 0;
            document.getElementById('hp').style.width = player.hp + '%';
        }
    });

    // 3. RENDERIZADO (DIBUJAR TODO)
    ctx.clearRect(0, 0, 800, 500);

    // Fondo simulado de rejilla metálica
    ctx.fillStyle = '#1c1c1c';
    for (let i = 0; i < 800; i += 40) {
        for (let j = 0; j < 500; j += 40) {
            ctx.strokeStyle = '#111';
            ctx.strokeRect(i, j, 40, 40);
        }
    }

    // Dibujar Balas
    ctx.fillStyle = '#ff0';
    bullets.forEach(b => {
        ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
    });

    // Dibujar Zombis (Bloques pixelados verdes)
    enemies.forEach(e => {
        ctx.fillStyle = '#2e5c2e'; // Cuerpo verde zombi
        ctx.fillRect(e.x - 8, e.y - 15, 16, 25);
        ctx.fillStyle = '#4a2306'; // Pantalón roto marrón
        ctx.fillRect(e.x - 8, e.y + 5, 16, 5);
    });

    // Dibujar a Leon S. Kennedy (Pixel Art hecho con rectángulos)
    ctx.fillStyle = '#dcb888'; // Piel / Cara
    ctx.fillRect(player.x - 6, player.y - 22, 12, 12);
    ctx.fillStyle = '#eed292'; // Cabello rubio característico
    ctx.fillRect(player.x - 7, player.y - 25, 14, 5);
    ctx.fillStyle = '#1a2b4c'; // Uniforme azul policial de R.P.D.
    ctx.fillRect(player.x - 8, player.y - 10, 16, 15);
    ctx.fillStyle = '#111';    // Botas / Cinturón
    ctx.fillRect(player.x - 6, player.y + 5, 12, 5);

    requestAnimationFrame(loop);
}

// Iniciar el juego automáticamente al cargar
requestAnimationFrame(loop);
</script>

</body>
</html>
